<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maria - Mi manchi tanto</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #ffe0ec 0%, #fff4b8 50%, #ffd1dc 100%);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }
  .petal {
    position: fixed;
    top: -50px;
    font-size: 28px;
    animation: fall linear infinite;
    pointer-events: none;
    z-index: 1;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0.3; }
  }
  .container {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 60px 20px;
    max-width: 900px;
    margin: 0 auto;
  }
  h1 {
    font-size: 8rem;
    color: #d6336c;
    font-family: 'Brush Script MT', cursive;
    text-shadow: 3px 3px 0px #ffd700, 6px 6px 15px rgba(214, 51, 108, 0.3);
    margin-bottom: 20px;
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .slogan {
    font-size: 3rem;
    color: #b5179e;
    font-family: 'Brush Script MT', cursive;
    margin: 30px 0;
    text-shadow: 2px 2px 4px rgba(255, 215, 0, 0.5);
  }
  .roses {
    font-size: 4rem;
    margin: 30px 0;
    letter-spacing: 10px;
    animation: sway 4s ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }
  .flower-row {
    font-size: 3rem;
    margin: 25px 0;
    letter-spacing: 8px;
  }
  .signature {
    margin-top: 50px;
    font-size: 2rem;
    color: #d6336c;
    font-family: 'Brush Script MT', cursive;
  }
  footer {
    text-align: center;
    padding: 30px;
    color: #b5179e;
    font-style: italic;
    position: relative;
    z-index: 10;
  }
  @media (max-width: 768px) {
    h1 { font-size: 4.5rem; }
    .slogan { font-size: 2rem; }
    .roses { font-size: 2.5rem; }
  }
</style>
</head>
<body>

<div class="petal" style="left: 5%; animation-duration: 8s;">🌸</div>
<div class="petal" style="left: 15%; animation-duration: 12s; animation-delay: 2s;">🌼</div>
<div class="petal" style="left: 25%; animation-duration: 10s; animation-delay: 4s;">🌹</div>
<div class="petal" style="left: 35%; animation-duration: 9s; animation-delay: 1s;">💛</div>
<div class="petal" style="left: 45%; animation-duration: 11s; animation-delay: 3s;">🌷</div>
<div class="petal" style="left: 55%; animation-duration: 13s; animation-delay: 5s;">🌸</div>
<div class="petal" style="left: 65%; animation-duration: 7s; animation-delay: 2s;">💖</div>
<div class="petal" style="left: 75%; animation-duration: 10s; animation-delay: 6s;">🌹</div>
<div class="petal" style="left: 85%; animation-duration: 12s; animation-delay: 1s;">🌻</div>
<div class="petal" style="left: 95%; animation-duration: 9s; animation-delay: 4s;">🌼</div>

<div class="container">
  <div class="roses">🌹 🌹 🌹 🌹 🌹</div>
  <h1>Maria</h1>
  <div class="slogan">~ Mi manchi tanto ~</div>
  <div class="flower-row">🌻 🌷 🌸 🌼 🌺 💐 🌹</div>
  <div class="flower-row">🌷 💛 🌹 💛 🌷 💛 🌹</div>
  <div class="roses">🌹🌷🌸🌼🌻💛🌺💐🌹</div>
  <div class="signature">Con tutto il mio amore 💕</div>
</div>

<footer>
  🌹 Fatto con amore per Maria 🌹
</footer>

<script>
  const emojis = ['🌸','🌼','🌹','💛','🌷','🌻','💖','🌺','💐'];
  setInterval(() => {
    const petal = document.createElement('div');
    petal.className = 'petal';
    petal.style.left = Math.random() * 100 + '%';
    petal.style.animationDuration = (7 + Math.random() * 8) + 's';
    petal.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    document.body.appendChild(petal);
    setTimeout(() => petal.remove(), 15000);
  }, 800);
</script>

</body>
</html>
