<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maria ♥</title>
<meta name="theme-color" content="#FFF9F4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="p038.jpg" fetchpriority="high">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF9F4;
    --card:#FFFFFF;
    --ink:#2E2126;
    --ink-soft:#8A737C;
    --rosa:#E4547C;
    --rosa-soft:#F9E3EA;
    --oro:#E8A15D;
    --ombra:0 10px 30px -12px rgba(46,33,38,.18);
    --r:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    overflow-x:hidden; -webkit-font-smoothing:antialiased;
  }
  img,video{display:block;max-width:100%}
  ::selection{background:var(--rosa-soft)}

  /* barra progresso */
  #bar{position:fixed;top:0;left:0;height:3px;width:100%;z-index:60;
    background:linear-gradient(90deg,var(--rosa),var(--oro));
    transform:scaleX(0);transform-origin:0 50%;will-change:transform}

  /* ------ HERO ------ */
  .hero{position:relative;height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.06);will-change:transform}
  .hero .velo{position:absolute;inset:0;background:
    radial-gradient(80% 60% at 50% 50%, rgba(30,15,20,.42) 0%, rgba(30,15,20,.12) 55%, rgba(30,15,20,0) 100%),
    linear-gradient(180deg, rgba(30,15,20,.25) 0%, rgba(30,15,20,0) 30%, rgba(30,15,20,0) 62%, rgba(30,15,20,.55) 100%)}
  .hero-in{position:relative;z-index:2;text-align:center;color:#fff;padding:0 1.5rem}
  .hero .cuorehero{font-size:clamp(1.6rem,3vw,2.4rem);display:inline-block;
    animation:battito 1.6s ease-in-out infinite;filter:drop-shadow(0 4px 14px rgba(0,0,0,.35))}
  @keyframes battito{0%,100%{transform:scale(1)}12%{transform:scale(1.22)}24%{transform:scale(1)}36%{transform:scale(1.14)}48%{transform:scale(1)}}
  .hero h1{font-family:'Fraunces',serif;font-style:italic;font-weight:400;
    font-size:clamp(4.6rem,16vw,12rem);line-height:.95;letter-spacing:-.03em;
    text-shadow:0 6px 40px rgba(0,0,0,.35);margin:.5rem 0 1rem}
  .hero .anni{font-family:'Fraunces',serif;font-style:italic;font-weight:300;
    font-size:clamp(1rem,2.1vw,1.45rem);line-height:1.5;letter-spacing:.03em;opacity:.95;
    max-width:34ch;margin:0 auto;text-shadow:0 3px 18px rgba(0,0,0,.4)}
  .hero .persempre{margin-top:1.1rem;font-weight:500;letter-spacing:.4em;
    font-size:clamp(.7rem,1.3vw,.9rem);text-transform:uppercase;opacity:.85;padding-left:.4em}
  .giu{position:absolute;bottom:2.2rem;left:50%;transform:translateX(-50%);z-index:2;
    color:#fff;opacity:.85;font-size:1.3rem;animation:giubob 2.2s ease-in-out infinite}
  @keyframes giubob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,10px)}}
  .cuori-vol{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .cuori-vol span{position:absolute;bottom:-6vh;font-size:1.1rem;opacity:0;animation:vola linear infinite}
  @keyframes vola{
    0%{opacity:0;transform:translateY(0) scale(.7) rotate(-8deg)}
    12%{opacity:.75}
    100%{opacity:0;transform:translateY(-108vh) scale(1.25) rotate(10deg)}
  }

  /* ------ GRID ------ */
  main{max-width:1180px;margin:0 auto;padding:0 clamp(.8rem,3vw,2rem)}
  .anno{display:flex;align-items:center;gap:1rem;margin:clamp(3rem,7vw,5rem) 0 1.6rem}
  .anno::before,.anno::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#E9D5DC);}
  .anno::after{background:linear-gradient(90deg,#E9D5DC,transparent)}
  .anno b{font-family:'Fraunces',serif;font-style:italic;font-weight:500;
    font-size:clamp(1.5rem,3.4vw,2.2rem);color:var(--rosa);white-space:nowrap}
  .anno small{font-size:1rem;transform:translateY(2px)}

  .griglia{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(.8rem,1.6vw,1.3rem)}
  @media(max-width:860px){.griglia{grid-template-columns:repeat(2,1fr)}}
  .cella{position:relative;aspect-ratio:1;cursor:pointer;
    filter:drop-shadow(0 14px 22px rgba(46,33,38,.22));
    opacity:0;transform:translateY(34px) scale(.92);
    transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1)}
  .cella.vis{opacity:1;transform:none}
  .cella .maschera{width:100%;height:100%;overflow:hidden;
    transition:transform .8s cubic-bezier(.16,1,.3,1)}
  .cella.cuore .maschera{clip-path:url(#clipCuore)}
  .cella.stella .maschera{clip-path:polygon(50% 2%,64% 30%,97% 33%,73% 55%,81% 93%,50% 75%,19% 93%,27% 55%,3% 33%,36% 30%)}
  .cella .maschera img,.cella .maschera video{width:100%;height:100%;object-fit:cover;object-position:50% 32%;
    transition:transform .8s cubic-bezier(.16,1,.3,1)}
  @media(hover:hover){.cella:hover .maschera img,.cella:hover .maschera video{transform:scale(1.07)}}
  .cella .tag{position:absolute;top:.65rem;right:.65rem;background:rgba(255,255,255,.85);
    backdrop-filter:blur(6px);border-radius:999px;padding:.28rem .6rem;font-size:.72rem;
    font-weight:600;color:var(--rosa);display:flex;align-items:center;gap:.3rem}
  .cuore-pop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);
    font-size:5rem;pointer-events:none;filter:drop-shadow(0 6px 18px rgba(0,0,0,.25))}
  .cuore-pop.vai{animation:pop .9s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes pop{
    0%{transform:translate(-50%,-50%) scale(0);opacity:0}
    30%{transform:translate(-50%,-50%) scale(1.25);opacity:1}
    60%{transform:translate(-50%,-50%) scale(1)}
    100%{transform:translate(-50%,-80%) scale(1);opacity:0}
  }

  /* ------ FRASI ------ */
  .frase{max-width:26ch;margin:clamp(3.5rem,8vw,6rem) auto;text-align:center;
    font-family:'Fraunces',serif;font-style:italic;font-weight:400;
    font-size:clamp(1.5rem,3.6vw,2.6rem);line-height:1.25;letter-spacing:-.01em;color:var(--ink);
    opacity:0;transform:translateY(30px);
    transition:opacity 1.1s cubic-bezier(.16,1,.3,1),transform 1.1s cubic-bezier(.16,1,.3,1)}
  .frase.vis{opacity:1;transform:none}
  .frase::after{content:"❤️";display:block;font-size:1.1rem;margin-top:1.2rem}

  .ultima{max-width:30ch;margin:clamp(2.5rem,6vw,4rem) auto 0;text-align:center;
    font-family:'Fraunces',serif;font-style:italic;font-weight:400;
    font-size:clamp(1.25rem,3vw,2rem);line-height:1.35;color:var(--testo, var(--ink));
    opacity:0;transform:translateY(26px);
    transition:opacity 1.2s cubic-bezier(.16,1,.3,1) .2s,transform 1.2s cubic-bezier(.16,1,.3,1) .2s}
  .ultima.vis{opacity:1;transform:none}

  /* ------ MOMENTI ------ */
  .momento{position:relative;margin:clamp(3rem,7vw,5.5rem) calc(50% - 50vw);height:min(92svh,860px);overflow:hidden}
  .momento img{width:100%;height:118%;object-fit:cover;will-change:transform}
  .momento .velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,15,20,.12),rgba(30,15,20,0) 35%,rgba(30,15,20,0) 65%,rgba(30,15,20,.3))}
  .momento .cuore-m{position:absolute;bottom:1.6rem;left:50%;transform:translateX(-50%);
    font-size:2rem;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4));animation:battito 1.8s ease-in-out infinite}

  /* ------ FINALE ------ */
  .finale{display:flex;flex-direction:column;align-items:center;padding:clamp(4rem,9vw,7rem) 1.2rem 3rem;text-align:center}
  .finale .cornice{width:min(88vw,560px);border-radius:24px;overflow:hidden;box-shadow:0 40px 90px -30px rgba(46,33,38,.4);
    opacity:0;transform:scale(.9);transition:opacity 1.4s cubic-bezier(.16,1,.3,1),transform 1.6s cubic-bezier(.16,1,.3,1)}
  .finale.vis .cornice{opacity:1;transform:none}
  .finale h2{font-family:'Fraunces',serif;font-style:italic;font-weight:400;
    font-size:clamp(3.6rem,13vw,9rem);line-height:1;letter-spacing:-.03em;margin-top:2.6rem;
    background:linear-gradient(115deg,var(--rosa) 10%,var(--oro) 55%,#E4547C 100%);background-size:200% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    opacity:0;transform:translateY(36px);transition:opacity 1.2s ease .35s,transform 1.2s cubic-bezier(.16,1,.3,1) .35s}
  .finale.vis h2{opacity:1;transform:none;animation:brilla 8s ease-in-out 2s infinite}
  @keyframes brilla{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
  .finale .cuoricini{margin-top:1.4rem;font-size:1.3rem;letter-spacing:.6rem;opacity:0;transition:opacity 1.2s ease .8s}
  .finale.vis .cuoricini{opacity:1}

  footer{padding:2.5rem 1.5rem 4rem;text-align:center;color:var(--ink-soft);
    font-family:'Fraunces',serif;font-style:italic;font-size:clamp(1rem,2vw,1.25rem)}
  footer .nome{color:var(--rosa);font-weight:500}

  /* musica */
  #musica{position:fixed;bottom:1.2rem;right:1.2rem;z-index:65;
    width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--rosa),var(--oro));color:#fff;font-size:1.35rem;
    box-shadow:0 10px 26px -8px rgba(46,33,38,.45);display:flex;align-items:center;justify-content:center;
    transition:transform .3s cubic-bezier(.16,1,.3,1)}
  #musica:active{transform:scale(.92)}
  #musica.suona{animation:battito 1.6s ease-in-out infinite}
  #ytwrap{position:fixed;width:1px;height:1px;bottom:0;left:0;opacity:.01;pointer-events:none;overflow:hidden}

  /* lightbox */
  #lb{position:fixed;inset:0;z-index:70;background:rgba(24,12,17,.92);display:none;
    align-items:center;justify-content:center;padding:2rem}
  #lb.on{display:flex}
  #lb img,#lb video{max-width:min(94vw,900px);max-height:88svh;width:auto;height:auto;border-radius:14px;
    box-shadow:0 30px 80px rgba(0,0,0,.5)}
  #lb .x{position:absolute;top:1.1rem;right:1.4rem;color:#fff;font-size:2rem;cursor:pointer;
    opacity:.8;line-height:1;background:none;border:none;font-family:inherit}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    .cella{opacity:1;transform:none}
  }
</style>
</head>
<body>

<div id="bar"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="clipCuore" clipPathUnits="objectBoundingBox">
      <path d="M 0.5 0.95 C 0.26 0.8 0.02 0.58 0.02 0.35 C 0.02 0.18 0.16 0.05 0.31 0.05 C 0.41 0.05 0.47 0.1 0.5 0.16 C 0.53 0.1 0.59 0.05 0.69 0.05 C 0.84 0.05 0.98 0.18 0.98 0.35 C 0.98 0.58 0.74 0.8 0.5 0.95 Z"></path>
    </clipPath>
  </defs>
</svg>

<section class="hero">
  <img src="p038.jpg" alt="" fetchpriority="high">
  <div class="velo"></div>
  <div class="cuori-vol" id="cuoriVol"></div>
  <div class="hero-in">
    <span class="cuorehero">❤️</span>
    <h1>Maria</h1>
    <p class="anni">Alcune delle nostre foto, così ti ricordi quanto ti amo.<br>E quanto mi piacciono i tuoi baci.</p>
    <p class="persempre">per sempre</p>
  </div>
  <div class="giu">↓</div>
</section>

<main id="book"></main>

<section class="finale" id="fine">
  <div class="cornice"><img src="p503.jpg" alt="" loading="lazy"></div>
  <h2>ti amo</h2>
  <p class="cuoricini">❤️ 🤍 ❤️</p>
  <p class="ultima">Se dovessi rifare tutto da capo, rifarei tutte le stesse strade pur di ritrovarti.</p>
</section>

<footer>il tuo <span class="nome">Charmy Boy</span> · g</footer>

<div id="lb"><button class="x" aria-label="chiudi">×</button><div id="lbBox"></div></div>

<button id="musica" aria-label="musica" title="L'emozione non ha voce">♪</button>
<div id="ytwrap"></div>

<script>
(function(){
  var ridotto = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- contenuto ---------- */
  var FLOW = [
    {i:["p031","p063","p118"]},
    {f:"Sei il mio posto preferito."},
    {i:["p140","v_gondola","p149","p150","v_neve","p155","p182","p504","p184","p188","p200","p202","p207"]},
    {m:"p029"},
    {f:"Grazie di esistere proprio adesso."},
    {i:["p012","p045","p015","p492","p216","p218","p219","p051","p033","p223","p122","p130","p227","p237"]},
    {i:["p065","p066","p052","p080","p094","p248","p253","p259","p269","p270"]},
    {m:"p291"},
    {i:["p311","p110","p314","p335","p119","p056","p356","p367","p402","p400","p383","p397","p498","p011"]},
    {m:"p404"},
    {f:"Le cose normali con te diventano le mie preferite."},
    {i:["p008","p041","p046","p007","p034","p003","p413","p002","p428","p455","p036","p466","p471","v_cabana","p477","p480","p009","n02","n03","n09","n21","n24","n10","n19","n15","n30"]},
    {m:"p497"}
  ];

  var main = document.getElementById('book');
  var frag = document.createDocumentFragment();

  var nCella = 0;
  function cella(name){
    var d = document.createElement('div');
    /* quasi tutti cuori, una stellina ogni tanto; i video sempre a cuore */
    var forma = (nCella % 5 === 3 && name.indexOf('v_') !== 0) ? 'stella' : 'cuore';
    nCella++;
    d.className = 'cella ' + forma;
    if(name.indexOf('v_') === 0){
      d.innerHTML = '<div class="maschera"><video src="'+name+'.mp4" poster="'+name+'_poster.jpg" muted loop playsinline preload="metadata"></video></div>';
    } else {
      d.innerHTML = '<div class="maschera"><img src="'+name+'.jpg" alt="" loading="lazy"></div>';
    }
    var pop = document.createElement('span');
    pop.className = 'cuore-pop'; pop.textContent = '❤️';
    d.appendChild(pop);
    return d;
  }

  FLOW.forEach(function(b){
    if(b.f){
      var fr = document.createElement('p');
      fr.className = 'frase';
      fr.textContent = b.f;
      frag.appendChild(fr);
      return;
    }
    if(b.m){
      var m = document.createElement('div');
      m.className = 'momento';
      m.innerHTML = '<img src="'+b.m+'.jpg" alt="" loading="lazy"'+(b.pos?' style="object-position:'+b.pos+'"':'')+'><div class="velo"></div><span class="cuore-m">❤️</span>';
      frag.appendChild(m);
      return;
    }
    if(b.y){
      var a = document.createElement('div');
      a.className = 'anno';
      a.innerHTML = '<b>'+b.y+'</b><small>❤️</small>';
      frag.appendChild(a);
    }
    var g = document.createElement('div');
    g.className = 'griglia';
    (b.i||[]).forEach(function(n){ g.appendChild(cella(n)); });
    frag.appendChild(g);
  });
  main.appendChild(frag);

  /* ---------- reveal ---------- */
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting){
        e.target.classList.add('vis');
        var v = e.target.querySelector && e.target.querySelector('video');
        if(v){ v.play().catch(function(){}); }
        if(!e.target.classList.contains('momento')) io.unobserve(e.target);
      } else {
        var v2 = e.target.querySelector && e.target.querySelector('video');
        if(v2) v2.pause();
      }
    });
  },{threshold:.12,rootMargin:'0px 0px -4% 0px'});
  document.querySelectorAll('.cella,.momento,.frase,.ultima').forEach(function(el){ io.observe(el); });

  var ioFin = new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); });
  },{threshold:.25});
  ioFin.observe(document.getElementById('fine'));

  /* ---------- cuoricini che volano nella hero ---------- */
  if(!ridotto){
    var vol = document.getElementById('cuoriVol');
    var EMO = ['❤️','🤍','💛','🩷'];
    for(var i=0;i<14;i++){
      var s = document.createElement('span');
      s.textContent = EMO[i%EMO.length];
      s.style.left = (4+Math.random()*92)+'%';
      s.style.fontSize = (0.8+Math.random()*1.1)+'rem';
      s.style.animationDuration = (7+Math.random()*8)+'s';
      s.style.animationDelay = (Math.random()*9)+'s';
      vol.appendChild(s);
    }
  }

  /* ---------- doppio tap = cuore ---------- */
  var ultimo = 0;
  main.addEventListener('click', function(ev){
    var c = ev.target.closest('.cella');
    if(!c) return;
    var ora = Date.now();
    if(ora - ultimo < 350){
      var p = c.querySelector('.cuore-pop');
      p.classList.remove('vai'); void p.offsetWidth; p.classList.add('vai');
      ultimo = 0;
      return;
    }
    ultimo = ora;
    setTimeout(function(){
      if(ultimo && Date.now()-ultimo >= 350){ apriLB(c); ultimo = 0; }
    }, 360);
  });

  /* ---------- lightbox ---------- */
  var lb = document.getElementById('lb'), box = document.getElementById('lbBox');
  function apriLB(c){
    var v = c.querySelector('video'), im = c.querySelector('img');
    box.innerHTML = '';
    if(v){
      var nv = document.createElement('video');
      nv.src = v.getAttribute('src'); nv.muted = true; nv.loop = true; nv.autoplay = true;
      nv.playsInline = true; nv.setAttribute('playsinline','');
      box.appendChild(nv);
    } else if(im){
      var ni = document.createElement('img'); ni.src = im.src; box.appendChild(ni);
    }
    lb.classList.add('on');
    document.body.style.overflow = 'hidden';
  }
  function chiudi(){ lb.classList.remove('on'); box.innerHTML=''; document.body.style.overflow=''; }
  lb.addEventListener('click', function(e){ if(e.target === lb || e.target.classList.contains('x')) chiudi(); });
  addEventListener('keydown', function(e){ if(e.key === 'Escape') chiudi(); });

  /* ---------- musica: L'emozione non ha voce (player YouTube ufficiale) ---------- */
  var btnM = document.getElementById('musica'), ytw = document.getElementById('ytwrap');
  var VIDEO = 'hZsLAhvuBzo';
  btnM.addEventListener('click', function(){
    if(ytw.firstChild){
      ytw.innerHTML = '';
      btnM.textContent = '♪'; btnM.classList.remove('suona');
    } else {
      var f = document.createElement('iframe');
      f.src = 'https://www.youtube-nocookie.com/embed/'+VIDEO+'?autoplay=1&loop=1&playlist='+VIDEO+'&controls=0';
      f.allow = 'autoplay; encrypted-media';
      f.width = 200; f.height = 200;
      ytw.appendChild(f);
      btnM.textContent = '❤️'; btnM.classList.add('suona');
    }
  });

  /* ---------- scroll: barra + parallax ---------- */
  var bar = document.getElementById('bar');
  var heroImg = document.querySelector('.hero img');
  var momenti = Array.prototype.slice.call(document.querySelectorAll('.momento img'));
  var coda = false;
  function tick(){
    var y = pageYOffset, vh = innerHeight;
    var tot = document.documentElement.scrollHeight - vh;
    bar.style.transform = 'scaleX(' + (tot>0 ? Math.min(y/tot,1) : 0) + ')';
    if(!ridotto){
      if(y < vh) heroImg.style.transform = 'translate3d(0,'+(y*.35)+'px,0) scale(1.06)';
      momenti.forEach(function(im){
        var r = im.parentElement.getBoundingClientRect();
        if(r.bottom < 0 || r.top > vh) return;
        var c = (r.top + r.height/2 - vh/2)/vh;
        im.style.transform = 'translate3d(0,'+(c*-7)+'%,0)';
      });
    }
    coda = false;
  }
  addEventListener('scroll', function(){ if(!coda){ coda=true; requestAnimationFrame(tick); } }, {passive:true});
  tick();

  // "momento" observer già in io: i video partono da soli quando visibili
})();
</script>
</body>
</html>
