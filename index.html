<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tanti ricordi ma tanti baci</title>
<meta name="theme-color" content="#E9E2D6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#E9E2D6;
  --inchiostro:#33281F;
  --inchiostro-2:#7A6B5C;
  --rosso:#93384A;
  --pellicola:sepia(.24) saturate(.82) contrast(1.05) brightness(1.03);
  --g:clamp(.45rem,1.1vw,.85rem);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Cormorant Garamond',serif;background:var(--fondo);color:var(--inchiostro);
  overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
::selection{background:rgba(147,56,74,.16)}

#grana{position:fixed;inset:0;z-index:45;pointer-events:none;opacity:.17;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='0.55'/></svg>");
  animation:sfarfallio .5s steps(2) infinite}
@keyframes sfarfallio{0%{opacity:.17}50%{opacity:.13}100%{opacity:.17}}

#bar{position:fixed;top:0;left:0;height:1px;width:100%;z-index:50;transform:scaleX(0);
  transform-origin:0 50%;background:var(--rosso);opacity:.7;will-change:transform}

/* ══════ 1. LA CARTA "you & me" — foglio a schermo intero ══════ */
.carta-piena{position:relative;width:100vw;height:100svh;overflow:hidden;
  margin-left:calc(50% - 50vw);background:#FAF8F4;filter:var(--pellicola);
  display:flex;align-items:center;justify-content:center}
/* filtro sull'intera sezione: fondo e foglio combaciano, nessuna cucitura */
.carta-piena img{width:100%;height:100%;object-fit:contain}
.carta-piena .sfuma{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(250,248,244,0) 86%,var(--fondo) 100%)}

/* ══════ 2. MAIN grossa + titolo sotto, centrato alla foto ══════ */
.mainhero{min-height:100svh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:clamp(2rem,5vw,3.5rem) 1.2rem clamp(1.5rem,4vw,2.5rem);text-align:center}
.mainhero .tela{display:inline-block;background:#F9F4EA;padding:12px;
  box-shadow:0 40px 80px -34px rgba(51,40,31,.8),0 0 0 1px rgba(51,40,31,.09)}
.mainhero .tela img{max-height:58svh;max-width:min(88vw,560px);width:auto;height:auto;
  filter:var(--pellicola)}
.mainhero h1{margin-top:clamp(1.4rem,3.2vw,2.2rem);max-width:min(88vw,560px);text-wrap:balance;
  font-family:'Fraunces',serif;font-weight:500;font-style:normal;
  font-size:clamp(1.7rem,5.2vw,3.4rem);line-height:1.1;letter-spacing:.03em;
  text-transform:uppercase;color:var(--inchiostro)}
.mainhero h1 b{color:var(--rosso);font-weight:500}
.giu{margin-top:1.3rem;font-size:1rem;color:var(--inchiostro-2);opacity:.55;
  animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}

/* ══════ 3. RIGHE DA 5 — sotto ogni foto una lettera ══════ */
#storia{max-width:1200px;margin:0 auto;padding:clamp(1rem,3vw,2rem) clamp(.7rem,2.5vw,1.6rem) 0}
.riga{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--g);
  margin-bottom:clamp(1.6rem,4vw,3rem)}
.cella{flex:0 0 calc((100% - var(--g) * 4) / 5);container-type:inline-size}
@media(max-width:760px){ .cella{flex:0 0 calc((100% - var(--g)) / 2)} }

.pz{position:relative;z-index:2;background:#F9F4EA;padding:5px;cursor:zoom-in;
  box-shadow:0 16px 26px -14px rgba(51,40,31,.55),0 3px 8px -3px rgba(51,40,31,.35),
             0 0 0 1px rgba(51,40,31,.09);
  opacity:0;transform:translateY(16px);
  transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .85s cubic-bezier(.16,1,.3,1)}
.pz.vis{opacity:1;transform:none}
.pz img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 34%;filter:var(--pellicola)}

.lettera{position:relative;z-index:1;display:block;text-align:center;
  font-family:'Fraunces',serif;font-weight:400;font-style:normal;
  font-size:86cqw;line-height:.78;letter-spacing:-.02em;
  color:var(--rosso);opacity:0;
  margin-top:-.14em;
  transition:opacity 1s ease .12s}
.lettera.vis{opacity:.92}

/* ══════ 4. ULTIMA FOTO ══════ */
.finale{text-align:center;padding:clamp(3.5rem,9vw,6rem) 1.4rem clamp(2.5rem,6vw,4rem)}
.finale .tela{display:inline-block;background:#F9F4EA;padding:13px;
  box-shadow:0 40px 80px -34px rgba(51,40,31,.8),0 0 0 1px rgba(51,40,31,.09);
  opacity:0;transform:scale(.94);
  transition:opacity 1.5s cubic-bezier(.16,1,.3,1),transform 1.6s cubic-bezier(.16,1,.3,1)}
.finale.vis .tela{opacity:1;transform:none}
.finale .tela img{width:min(88vw,620px);height:auto;aspect-ratio:3/4;
  object-fit:contain;filter:var(--pellicola)}
.finale .chiusa{margin-top:2.2rem;font-family:'Fraunces',serif;font-style:italic;font-weight:300;
  font-size:clamp(1.5rem,4vw,2.4rem);color:var(--rosso);
  opacity:0;transform:translateY(18px);
  transition:opacity 1.2s ease .5s,transform 1.2s cubic-bezier(.16,1,.3,1) .5s}
.finale.vis .chiusa{opacity:1;transform:none}

footer{padding:.5rem 1.5rem 4.5rem;text-align:center;color:var(--inchiostro-2);
  font-style:italic;font-size:1.05rem}
footer .nome{color:var(--rosso)}

#musica{position:fixed;bottom:1.2rem;right:1.2rem;z-index:48;width:44px;height:44px;border-radius:50%;
  border:1px solid rgba(51,40,31,.18);cursor:pointer;background:#F9F4EA;color:var(--rosso);font-size:1.05rem;
  box-shadow:0 10px 24px -12px rgba(51,40,31,.6);display:flex;align-items:center;justify-content:center;
  transition:transform .3s}
#musica:active{transform:scale(.92)}
#musica.on{background:var(--rosso);color:#F9F4EA}
#ytwrap{position:fixed;width:1px;height:1px;bottom:0;left:0;opacity:.01;pointer-events:none;overflow:hidden}

#lb{position:fixed;inset:0;z-index:60;background:rgba(26,19,13,.94);display:none;
  align-items:center;justify-content:center;padding:2rem}
#lb.on{display:flex}
#lb img{max-width:min(92vw,820px);max-height:88svh;width:auto;height:auto;
  border:8px solid #F9F4EA;box-shadow:0 30px 80px rgba(0,0,0,.7);filter:var(--pellicola)}
#lb .x{position:absolute;top:1rem;right:1.3rem;color:#F9F4EA;font-size:2rem;cursor:pointer;
  opacity:.8;background:none;border:none;line-height:1}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .pz{opacity:1;transform:none}
  .lettera{opacity:.92}
}
</style>
</head>
<body>

<div id="grana"></div>
<div id="bar"></div>

<section class="carta-piena">
  <img id="imgCarta" alt="">
  <div class="sfuma"></div>
</section>

<section class="mainhero">
  <figure class="tela"><img id="imgMain" alt=""></figure>
  <h1>tanti ricordi<br><b>ma tanti baci</b></h1>
  <div class="giu">↓</div>
</section>

<main id="storia"></main>

<section class="finale" id="fine">
  <figure class="tela"><img id="imgUltima" alt="" fetchpriority="high"></figure>
  <p class="chiusa">Con te ci rifarei tutto.</p>
</section>

<footer>il tuo <span class="nome">Charmy Boy</span> · g</footer>

<div id="lb"><button class="x" aria-label="chiudi">×</button><div id="lbBox"></div></div>
<button id="musica" aria-label="musica" title="L'emozione non ha voce">♪</button>
<div id="ytwrap"></div>

<script>
(function(){
  var SRC = window.__SRC || null;
  function u(n){ return SRC ? (SRC[n]||'') : n + '.jpg'; }

  document.getElementById('imgCarta').src  = u('carta');
  document.getElementById('imgMain').src   = u('main');
  document.getElementById('imgUltima').src = u('ultima');

var FOTO = ["f000","f001","f002","f003","f004","f006","f007","f008","f009","f010",
    "f011","f012","f013","f015","f016","f017","f018","f019","f020","f021",
    "f022","f023","f024","f026","f027","f028","f029","f030","f031","f032",
    "f033","f034","f035","f036","f037","f038","f041","f044","f045","f047",
    "f048","f051","f052","f053","f054","f055","f056","f057","f058","f059",
    "f043","f061","f062","f063","f064","f065","f066","f067","f068","f069",
    "f070","f071","f072","f005","f039"];

  var PAROLA = "TIAMO";
  var storia = document.getElementById('storia');
  var frag = document.createDocumentFragment();

  for(var i = 0; i < FOTO.length; i += 5){
    var r = document.createElement('div'); r.className = 'riga';
    FOTO.slice(i, i + 5).forEach(function(f, k){
      var c = document.createElement('div'); c.className = 'cella';
      c.innerHTML = '<figure class="pz"><img src="' + u(f) + '" alt="" loading="lazy"></figure>'
                  + '<span class="lettera">' + PAROLA.charAt(k) + '</span>';
      r.appendChild(c);
    });
    frag.appendChild(r);
  }
  storia.appendChild(frag);

  /* comparse */
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('vis'); io.unobserve(e.target); } });
  },{threshold:.1, rootMargin:'0px 0px -4% 0px'});
  document.querySelectorAll('.pz,.lettera').forEach(function(el){ io.observe(el); });
  new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); });
  },{threshold:0, rootMargin:'0px 0px -10% 0px'}).observe(document.getElementById('fine'));

  /* lightbox */
  var lb = document.getElementById('lb'), box = document.getElementById('lbBox');
  document.addEventListener('click', function(ev){
    var im = ev.target.closest('.pz img, .tela img, .mainhero img');
    if(!im) return;
    box.innerHTML=''; var n=document.createElement('img'); n.src=im.src;
    box.appendChild(n); lb.classList.add('on'); document.body.style.overflow='hidden';
  });
  function chiudi(){ lb.classList.remove('on'); box.innerHTML=''; document.body.style.overflow=''; }
  lb.addEventListener('click', function(e){ if(e.target===lb||e.target.classList.contains('x')) chiudi(); });
  addEventListener('keydown', function(e){ if(e.key==='Escape') chiudi(); });

  /* musica */
  var btn = document.getElementById('musica'), ytw = document.getElementById('ytwrap');
  var VID = 'hZsLAhvuBzo';
  btn.addEventListener('click', function(){
    if(ytw.firstChild){ ytw.innerHTML=''; btn.textContent='♪'; btn.classList.remove('on'); }
    else{ var f=document.createElement('iframe');
      f.src='https://www.youtube-nocookie.com/embed/'+VID+'?autoplay=1&loop=1&playlist='+VID+'&controls=0';
      f.allow='autoplay; encrypted-media'; f.width=200; f.height=200;
      ytw.appendChild(f); btn.textContent='♥'; btn.classList.add('on'); }
  });

  /* barra */
  var bar = document.getElementById('bar'), coda = false;
  function tick(){
    var tot = document.documentElement.scrollHeight - innerHeight;
    bar.style.transform = 'scaleX(' + (tot>0 ? Math.min(pageYOffset/tot,1) : 0) + ')';
    coda = false;
  }
  addEventListener('scroll', function(){ if(!coda){coda=true;requestAnimationFrame(tick);} },{passive:true});
  tick();
})();
</script>
</body>
</html>
