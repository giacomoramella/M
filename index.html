<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maria - Mi manchi tanto</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(180deg, #ffe0ec 0%, #fff4b8 30%, #ffd1dc 60%, #fff4b8 80%, #ffe0ec 100%);
    min-height: 100vh;
    overflow-x: hidden;
    color: #8b1a4f;
  }
  .petal { position: fixed; top: -50px; font-size: 28px; animation: fall linear infinite; pointer-events: none; z-index: 2; }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0.3; }
  }
  section { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; position: relative; z-index: 10; }
  .hero { text-align: center; }
  .hero .roses { font-size: 4rem; margin-bottom: 30px; letter-spacing: 10px; animation: sway 4s ease-in-out infinite; }
  @keyframes sway {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }
  .hero h1 { font-size: 10rem; color: #d6336c; font-family: 'Brush Script MT', cursive; text-shadow: 4px 4px 0px #ffd700, 8px 8px 20px rgba(214, 51, 108, 0.3); margin-bottom: 30px; animation: pulse 3s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .hero .slogan { font-size: 3.5rem; color: #b5179e; font-family: 'Brush Script MT', cursive; margin: 20px 0 40px; text-shadow: 2px 2px 4px rgba(255, 215, 0, 0.5); }
  .hero .flower-row { font-size: 3rem; letter-spacing: 8px; }
  .rose-section { min-height: 150vh; }
  .rose-stage {
    width: min(700px, 90vw); height: min(700px, 90vw); position: relative;
    transform: scale(calc(0.4 + var(--p, 0) * 1.4));
    transition: transform 0.1s linear;
  }
  .rose-svg { width: 100%; height: 100%; overflow: visible; }
  .rose-svg .petal-part {
    transform-origin: 200px 220px;
    transform: scale(calc(0.2 + var(--p, 0) * 0.8));
    transition: transform 0.1s linear;
    fill: hsl(340, calc(var(--p, 0) * 80% + 10%), calc(98% - var(--p, 0) * 40%));
    stroke: #d6336c;
    stroke-width: 2;
    stroke-opacity: calc(0.4 + var(--p, 0) * 0.6);
  }
  .rose-svg .leaf {
    transform-origin: 200px 320px;
    transform: scale(calc(0.2 + var(--p, 0) * 0.8));
    fill: hsl(120, calc(var(--p, 0) * 60% + 10%), calc(85% - var(--p, 0) * 40%));
    transition: transform 0.1s linear;
  }
  .rose-svg .stem {
    stroke: hsl(120, calc(var(--p, 0) * 60% + 10%), calc(70% - var(--p, 0) * 30%));
    stroke-width: 6; fill: none; stroke-linecap: round;
    stroke-dasharray: 200;
    stroke-dashoffset: calc(200 - var(--p, 0) * 200);
    transition: all 0.1s linear;
  }
  .plane-section { min-height: 200vh; background: linear-gradient(180deg, transparent 0%, rgba(255, 255, 255, 0.3) 50%, transparent 100%); overflow: hidden; }
  .sky { width: 100%; height: 100vh; position: relative; overflow: hidden; }
  .plane { position: absolute; left: 0; top: 0; font-size: 7rem; z-index: 5; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.15)); will-change: transform; }
  .trail { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .heart-drop { position: absolute; font-size: 2rem; animation: heartDrift 3s ease-out forwards; pointer-events: none; }
  @keyframes heartDrift {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(80px) scale(0.4); }
  }
  footer { text-align: center; padding: 30px; color: #b5179e; font-style: italic; position: relative; z-index: 10; }
  @media (max-width: 768px) {
    .hero h1 { font-size: 5rem; }
    .hero .slogan { font-size: 2rem; }
    .hero .roses, .hero .flower-row { font-size: 2.2rem; letter-spacing: 4px; }
    .plane { font-size: 4.5rem; }
  }
</style>
</head>
<body>

<div class="petal" style="left: 5%; animation-duration: 8s;">🌸</div>
<div class="petal" style="left: 18%; animation-duration: 12s; animation-delay: 2s;">🌼</div>
<div class="petal" style="left: 30%; animation-duration: 10s; animation-delay: 4s;">🌹</div>
<div class="petal" style="left: 45%; animation-duration: 11s; animation-delay: 1s;">💛</div>
<div class="petal" style="left: 60%; animation-duration: 9s; animation-delay: 3s;">🌷</div>
<div class="petal" style="left: 75%; animation-duration: 13s; animation-delay: 5s;">🌻</div>
<div class="petal" style="left: 90%; animation-duration: 10s; animation-delay: 2s;">💖</div>

<section class="hero">
  <div class="roses">🌹 🌹 🌹 🌹 🌹</div>
  <h1>Maria</h1>
  <div class="slogan">~ Mi manchi tanto ~</div>
  <div class="flower-row">🌻 🌷 🌸 🌼 🌺 💐 🌹</div>
</section>

<section class="rose-section" id="rose">
  <div class="rose-stage" id="rose-stage">
    <svg class="rose-svg" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
      <path class="stem" d="M 200 450 Q 200 380 200 320 Q 200 280 200 240" />
      <ellipse class="leaf" cx="160" cy="340" rx="40" ry="18" transform="rotate(-30 160 340)" />
      <ellipse class="leaf" cx="240" cy="370" rx="40" ry="18" transform="rotate(30 240 370)" />
      <path class="petal-part" d="M 200 220 Q 130 180 120 250 Q 130 310 200 280 Z" />
      <path class="petal-part" d="M 200 220 Q 270 180 280 250 Q 270 310 200 280 Z" />
      <path class="petal-part" d="M 200 160 Q 140 150 140 220 Q 170 240 200 220 Z" />
      <path class="petal-part" d="M 200 160 Q 260 150 260 220 Q 230 240 200 220 Z" />
      <path class="petal-part" d="M 200 200 Q 160 170 165 220 Q 185 240 200 230 Z" />
      <path class="petal-part" d="M 200 200 Q 240 170 235 220 Q 215 240 200 230 Z" />
      <circle class="petal-part" cx="200" cy="215" r="22" />
      <circle class="petal-part" cx="200" cy="210" r="14" />
    </svg>
  </div>
</section>

<section class="plane-section" id="plane">
  <div class="sky" id="sky">
    <div class="trail" id="trail"></div>
    <div class="plane" id="plane-icon">✈️</div>
  </div>
</section>

<footer>
  🌹 Fatto con amore dal tuo charmy boy 🌹
</footer>

<script>
  const emojis = ['🌸','🌼','🌹','💛','🌷','🌻','💖','🌺','💐'];
  setInterval(() => {
    const petal = document.createElement('div');
    petal.className = 'petal';
    petal.style.left = Math.random() * 100 + '%';
    petal.style.animationDuration = (7 + Math.random() * 8) + 's';
    petal.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    document.body.appendChild(petal);
    setTimeout(() => petal.remove(), 15000);
  }, 900);

  function progress(el) {
    const r = el.getBoundingClientRect();
    const vh = window.innerHeight;
    const total = r.height + vh;
    const passed = vh - r.top;
    return Math.max(0, Math.min(1, passed / total));
  }

  const roseStage = document.getElementById('rose-stage');
  const sky = document.getElementById('sky');
  const trail = document.getElementById('trail');
  const planeIcon = document.getElementById('plane-icon');
  let lastDropTime = 0;

  function tick() {
    const pRose = progress(document.getElementById('rose'));
    const bloom = Math.max(0, Math.min(1, pRose / 0.4));
    roseStage.style.setProperty('--p', bloom);

    const pPlane = progress(document.getElementById('plane'));
    const t = pPlane * 4 * Math.PI;
    const skyRect = sky.getBoundingClientRect();
    const w = skyRect.width;
    const h = skyRect.height;
    const centerX = w * 0.5;
    const centerY = h * (0.12 + pPlane * 0.7);
    const radiusX = w * 0.35;
    const radiusY = 80;
    const x = centerX + Math.sin(t) * radiusX;
    const y = centerY + Math.sin(2 * t) * radiusY * 0.5;

    const dx = Math.cos(t) * radiusX;
    const dy = Math.cos(2 * t) * radiusY;
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    planeIcon.style.transform = 'translate(' + x + 'px, ' + y + 'px) translate(-50%, -50%) rotate(' + angle + 'deg)';

    const now = performance.now();
    if (pPlane > 0 && pPlane < 1 && now - lastDropTime > 25) {
      const count = 2 + Math.floor(Math.random() * 2);
      for (let i = 0; i < count; i++) {
        const px = x + (Math.random() - 0.5) * 60;
        const py = y + (Math.random() - 0.5) * 30;
        const heart = document.createElement('div');
        heart.className = 'heart-drop';
        heart.style.left = px + 'px';
        heart.style.top = py + 'px';
        heart.style.animationDuration = (2 + Math.random() * 2) + 's';
        const hearts = ['💗','💖','💕','💞','💓'];
        heart.textContent = hearts[Math.floor(Math.random()*hearts.length)];
        trail.appendChild(heart);
        setTimeout(() => heart.remove(), 4000);
      }
      lastDropTime = now;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>

</body>
</html>
